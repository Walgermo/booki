product: Booki, agent-first UI controls for accounting and auditing (React), for teams building accounting software
personality: [precise, calm, trustworthy]
sizes: [16, 20]
dir: packages/icons
avoid:
  [letters or digits inside icons, currency symbols (money is a banknote or coins), people or hands, 3D or perspective]
dna:
  style: duotone
  stroke: 1.5
  grid: 24
  padding: 1
  keylines: { circle: 20, square: 18, portrait: [16, 20], landscape: [20, 16] }
  corners: { family: circular, radius: { large: 1.5, small: 1 }, largeThreshold: 8 }
  caps: round
  joins: round
  angles: [0, 45, 90]
  detail: low
  minGap: 2
  badge: { position: bottom-right, size: 8, gap: 2 }
  duotoneOpacity: 0.2
