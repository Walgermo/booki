<!doctype html><html lang="nb"><head><meta charset="utf-8"><title>Empty WebMCP snapshot with fields</title>
<script>
// A bridge exposed only through registerTools: a snapshot tool that lists no controls, plus an app tool.
for (const name of ["snapshot", "act", "query", "open_invoice"]) {
  document.modelContext.registerTool({
    name,
    description: name,
    inputSchema: { type: "object" },
    execute: async () => (name === "snapshot" ? { components: [] } : {}),
  });
}
</script></head>
<body><main>
<h1>Bilag</h1>
<label>Konto <select><option>1920 Bank</option><option>3000 Salg</option></select></label>
<label>Kommentar <textarea></textarea></label>
</main></body></html>
