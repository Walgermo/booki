<!doctype html><html lang="nb"><head><meta charset="utf-8"><title>WebMCP tool object registered twice</title>
<script>
// One tool object, registered with signal A and again with signal B; A is aborted after B took over.
const snapshot = {
  name: "snapshot",
  description: "snapshot",
  inputSchema: { type: "object" },
  execute: async () => [{ ref: "c1", component: "input", label: "Beløp", actions: ["setValue"] }],
};
const a = new AbortController();
const b = new AbortController();
document.modelContext.registerTool(snapshot, { signal: a.signal });
navigator.modelContext.registerTool(snapshot, { signal: b.signal });
a.abort();
</script></head>
<body><main><label>Beløp <input type="text"></label></main></body></html>
