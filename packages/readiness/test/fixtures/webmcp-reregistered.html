<!doctype html><html lang="nb"><head><meta charset="utf-8"><title>WebMCP registered twice</title>
<script>
// As ui-sdk's registerTools does under React's development double effect:
// register, clean up by aborting the signal, register again.
const snapshot = [{ ref: "c1", component: "input", label: "Beløp", actions: ["setValue"] }];
const register = (signal) => {
  for (const name of ["snapshot", "act", "query"]) {
    document.modelContext.registerTool(
      {
        name,
        description: name,
        inputSchema: { type: "object" },
        execute: async () => (name === "snapshot" ? snapshot : {}),
      },
      { signal },
    );
  }
};
const first = new AbortController();
register(first.signal);
first.abort();
register(new AbortController().signal);
// One tool registered on document and again on navigator.
const post = { name: "post_voucher", description: "Post a voucher", inputSchema: { type: "object" }, execute: async () => ({}) };
document.modelContext.registerTool(post);
navigator.modelContext.registerTool(post);
</script></head>
<body><main><label>Beløp <input type="text"></label></main></body></html>
