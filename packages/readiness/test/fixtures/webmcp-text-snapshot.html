<!doctype html><html lang="nb"><head><meta charset="utf-8"><title>WebMCP snapshot in plain text</title>
<script>
// A snapshot tool that describes the page in words, not as a list of controls.
for (const name of ["snapshot", "open_invoice"]) {
  document.modelContext.registerTool({
    name,
    description: name,
    inputSchema: { type: "object" },
    execute: async () => (name === "snapshot" ? { content: [{ type: "text", text: "Konto: a select with 1920 and 3000." }] } : {}),
  });
}
</script></head>
<body><main>
<h1>Bilag</h1>
<label>Konto <select><option>1920 Bank</option><option>3000 Salg</option></select></label>
</main></body></html>
