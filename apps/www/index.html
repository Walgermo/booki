<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: the page reaches under the notch and home indicator, and env(safe-area-inset-*) is no
         longer 0. interactive-widget=resizes-content: on Android the keyboard resizes the page instead of covering it. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- The browser's bar takes the page's colour: Paper or Night. data-color keeps each one for the theme toggle. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f6f4" data-scheme="light" data-color="#f6f6f4" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1117" data-scheme="dark" data-color="#0d1117" />
    <script>
      // Paper or Night before the first paint: the stored choice, else the system.
      // Language before the first paint: the visitor's pick, else Norwegian for a Norwegian browser.
      try {
        var l = localStorage.getItem("booki-lang");
        var first = (navigator.languages && navigator.languages[0]) || navigator.language || "";
        document.documentElement.lang = l || (/^(nb|nn|no)\b/i.test(first) ? "nb" : "en");
      } catch (e) {}
      var t;
      try { t = localStorage.getItem("booki-theme"); } catch (e) {}
      {
        var dark = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.setAttribute("data-bk-theme", "dark");
        // A stored choice may differ from the system: the browser's bar follows the choice.
        if (t) {
          var bars = document.querySelectorAll('meta[name="theme-color"]');
          var pick = document.querySelector('meta[name="theme-color"][data-scheme="' + (dark ? "dark" : "light") + '"]');
          for (var i = 0; pick && i < bars.length; i++) bars[i].setAttribute("content", pick.getAttribute("data-color"));
        }
      }
      // The hero figures' marks draw themselves once per visit, not on every page view in it.
      try {
        if (sessionStorage.getItem("booki-kpi-seen")) document.documentElement.setAttribute("data-kpi-still", "");
        else sessionStorage.setItem("booki-kpi-seen", "1");
      } catch (e) {}
    </script>
    <link rel="preload" href="/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/GeistMono-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:site_name" content="Booki" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Booki: Agent-first UI for your app" />
    <meta
      property="og:description"
      content="Open-source UI components for people and AI agents. Build forms, tables and workflows with named actions and human approvals."
    />
    <meta property="og:url" content="https://booki.dev/" />
    <meta property="og:image" content="https://booki.dev/og.png" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta property="og:image:alt" content="Booki: get agentic UI for your app. A deal updated by an agent under the company's rule." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Booki: Agent-first UI for your app" />
    <meta name="twitter:description" content="Open-source UI components for people and AI agents. Build forms, tables and workflows with named actions and human approvals." />
    <meta name="twitter:image" content="https://booki.dev/og.png" />
    <title>Booki: Agent-first UI for your app</title>
    <meta
      name="description"
      content="Open-source UI components for people and AI agents. Build forms, tables and workflows with named actions and human approvals."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
