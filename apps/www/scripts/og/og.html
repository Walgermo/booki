<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Booki share image</title>
    <style>
      /* The share image, 1200 x 630, drawn with the site's own fonts and the
         Paper and Ink values from @booki-aui/styles. Rendered to PNG by render.mjs. */
      @font-face {
        font-family: "Geist";
        src: url("../../public/fonts/Geist-Variable.woff2") format("woff2");
        font-weight: 100 900;
      }
      @font-face {
        font-family: "Geist Mono";
        src: url("../../public/fonts/GeistMono-Variable.woff2") format("woff2");
        font-weight: 100 900;
      }
      :root {
        --bg: oklch(0.973 0.003 100);
        --card: oklch(0.996 0.001 100);
        --muted: oklch(0.948 0.004 100);
        --accent: oklch(0.948 0.008 262);
        --fg: oklch(0.19 0.012 262);
        --muted-fg: oklch(0.47 0.01 262);
        --border: oklch(0.895 0.004 262);
        --brand: oklch(0.44 0.1 262);
        --signal: oklch(0.9 0.19 118);
        --signal-fg: oklch(0.22 0.04 125);
        --signal-tint: oklch(0.965 0.05 118);
        --mono: "Geist Mono", ui-monospace, monospace;
      }
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 1200px; height: 630px; }
      body {
        position: relative;
        overflow: hidden;
        display: grid;
        grid-template-columns: 500px 1fr;
        gap: 40px;
        padding: 64px 0 64px 72px;
        background:
          repeating-linear-gradient(to bottom, transparent 0 31px, color-mix(in oklch, var(--border) 55%, transparent) 31px 32px),
          var(--bg);
        color: var(--fg);
        font-family: "Geist", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .copy { display: grid; align-content: space-between; }
      .logo { display: flex; align-items: center; gap: 12px; font-size: 30px; font-weight: 650; letter-spacing: -0.03em; }
      h1 { font-size: 72px; line-height: 0.98; font-weight: 650; letter-spacing: -0.045em; }
      h1 em { font-style: normal; box-shadow: inset 0 -0.22em 0 var(--signal); }
      .lede { margin-top: 22px; color: var(--muted-fg); font-size: 22px; line-height: 1.35; max-width: 25ch; }
      .protocols { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }

      /* The stage, as on the site's hero. */
      .stage {
        position: relative;
        margin: -24px 0;
        border-radius: 32px 0 0 32px;
        background:
          radial-gradient(70% 80% at 20% 10%, color-mix(in oklch, var(--brand) 26%, transparent), color-mix(in oklch, var(--brand) 8%, transparent) 55%, transparent 80%),
          radial-gradient(60% 70% at 95% 95%, color-mix(in oklch, var(--signal) 45%, transparent), color-mix(in oklch, var(--signal) 10%, transparent) 55%, transparent 80%),
          var(--accent);
      }
      .card {
        position: absolute;
        top: 70px;
        left: 44px;
        width: 500px;
        padding: 26px 28px;
        border-radius: 16px;
        background: var(--card);
        box-shadow: 0 0 0 1px var(--border), 0 2px 4px rgb(0 0 0 / 0.06), 0 40px 70px -30px rgb(0 0 0 / 0.35);
      }
      .head { display: flex; justify-content: space-between; align-items: end; }
      .crumb { color: var(--muted-fg); font-size: 15px; }
      .title { margin-top: 4px; font-size: 24px; font-weight: 650; letter-spacing: -0.02em; }
      .total { font-family: var(--mono); font-size: 26px; font-weight: 600; letter-spacing: -0.03em; }
      .rows { margin-top: 22px; border-radius: 10px; box-shadow: 0 0 0 1px var(--border); overflow: visible; }
      .row { display: grid; grid-template-columns: 56px 1fr auto; gap: 14px; align-items: center; padding: 14px 16px; font-size: 17px; border-top: 1px solid var(--border); }
      .row:first-child { border-top: 0; }
      .row.th { padding: 10px 16px; background: var(--muted); font-family: var(--mono); font-size: 12px; letter-spacing: 0.06em; color: var(--muted-fg); text-transform: uppercase; border-radius: 10px 10px 0 0; }
      .row .acct, .row .amt { font-family: var(--mono); }
      .row .amt { text-align: right; }
      /* The row the agent just set: the cursor's ring and the agent's tint. */
      .row.agent {
        position: relative;
        background: var(--signal-tint);
        box-shadow: 0 0 0 2px var(--signal), 0 0 0 7px color-mix(in oklch, var(--signal) 28%, transparent);
        border-radius: 6px;
        z-index: 1;
      }
      .balance { display: flex; justify-content: space-between; padding: 12px 16px; border-top: 1px solid var(--border); font-weight: 600; font-family: var(--mono); font-size: 15px; background: color-mix(in oklch, var(--muted) 70%, transparent); border-radius: 0 0 10px 10px; }
      .posted {
        margin-top: 20px;
        display: inline-flex; gap: 10px; align-items: center;
        padding: 8px 14px; border-radius: 8px;
        background: var(--signal-tint);
        box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--signal) 70%, transparent);
        font-family: var(--mono); font-size: 14px;
      }
      .cursor { position: absolute; top: 312px; left: 352px; z-index: 2; filter: drop-shadow(0 4px 6px rgb(0 0 0 / 0.2)); }
      .cursor .label {
        position: absolute; top: 30px; left: 22px; white-space: nowrap;
        padding: 5px 10px; border-radius: 6px;
        background: var(--signal); color: var(--signal-fg);
        font-family: var(--mono); font-size: 13px; font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="copy">
      <div class="logo">
        <svg width="44" height="44" viewBox="0 0 24 24">
          <rect x="2" y="1.5" width="16.5" height="20" rx="3" fill="var(--fg)" />
          <path d="M6 6.75h8.5M6 14.75h5" stroke="var(--bg)" stroke-width="1.5" stroke-linecap="round" />
          <path d="M5.75 10.75h9" stroke="var(--signal)" stroke-width="2.4" stroke-linecap="round" />
          <path d="M13.4 11.6 L13.4 22.2 L16.2 19.6 L18.1 23.4 L19.9 22.6 L18.1 18.8 L21.9 18.5 Z" fill="var(--signal)" stroke="var(--fg)" stroke-width="1.1" stroke-linejoin="round" />
        </svg>
        Booki
      </div>
      <div>
        <h1>Get <em>agentic</em> UI for your app</h1>
        <p class="lede">Open-source UI components for people and AI agents.</p>
      </div>
      <p class="protocols">MCP · WebMCP</p>
    </div>

    <div class="stage">
      <div class="card">
        <div class="head">
          <div>
            <p class="crumb">Sales / Deals / Brattli AS</p>
            <p class="title">Renewal 2027</p>
          </div>
          <p class="total">180 000 kr</p>
        </div>
        <div class="rows">
          <div class="row th"><span>Step</span><span>Field</span><span>Value</span></div>
          <div class="row agent"><span class="acct">1</span><span>Stage</span><span class="amt">Negotiation</span></div>
          <div class="row"><span class="acct">2</span><span>Close date</span><span class="amt">24.12.2026</span></div>
          <div class="balance"><span>Your rule</span><span>allowed</span></div>
        </div>
        <p class="posted">✓ Updated by the agent under your rule</p>
      </div>
      <div class="cursor">
        <svg width="30" height="33" viewBox="0.5 0.5 20 22">
          <path d="M2.5 2.5V18.5L5.75 15.25L8.25 21.25L11.75 19.75L9.25 13.75H13.75Z" fill="var(--fg)" stroke="white" stroke-width="1.3" stroke-linejoin="round" />
        </svg>
        <span class="label">Agent · moved it</span>
      </div>
    </div>
  </body>
</html>
