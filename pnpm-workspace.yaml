packages:
  - "apps/*"
  - "packages/*"
  - "benchmarks/*"
  - "examples/*"
allowBuilds:
  esbuild: true
# Approved by the owner for the ui-sdk beta.17 upgrade (published 2026-11-24); harmless once it is a day old.
minimumReleaseAgeExclude:
  - "@ui-sdk/core@0.1.0-beta.17"
  - "@ui-sdk/react@0.1.0-beta.17"
  - "@ui-sdk/solid@0.1.0-beta.17"
  - "@ui-sdk/svelte@0.1.0-beta.17"
  - "@ui-sdk/vue@0.1.0-beta.17"
  - "@ui-sdk/web@0.1.0-beta.17"
